{% extends "base.html" %}

{% block header %}
<title>panel | todo list</title>
{% endblock %}

{% block body %}

<section class="tasks-box">
    <ul id="tasks">
    {% for task in user.tasks %}
        <li><span onclick = "edit(this,{{task.id}})">{{task.description}}</span><span onclick='remove_task({{task.id}},this)'class = "done-btn">DONE</span></li>
    {% endfor %}
    </ul>

    <form name="add" action="javascript:add_task()" method="POST">
        <input type="hidden" name = csrf_token value="{{ csrf_token()}}">
        <div class="add-task-box">
        <input type="text" placeholder="add new task" id = "description"name = description>
        </div>
    </form>

</section>



<section class="form-box" style="margin: 10px auto;">
    <form action="{{url_for('panel_blueprint.edit_contact')}}" method="POST">
        <input type="hidden" name = "csrf_token" value="{{ csrf_token() }}">
        <div class="input-group">
        <label for="phone">phone:</label><input type="number" value="{{user.contact.phone}}" placeholder="0900000000" name="phone">
        </div>
        <div class="input-group">
        <label for="city">city:</label><input type="text" value="{{user.contact.city}}" name="city" placeholder="tehran">
        </div>
        <input type="submit" value="ارسال">
    </form>
</section>

<script>
    let tasks = document.getElementById("tasks")
    let description = document.getElementById("description")

    const add_task = ()=>{
        fetch("{{url_for('panel_blueprint.add')}}",{method:"post",body:new FormData(add)})
        .then((res)=>{
            res.json().then((result)=>{
                if(result.status == "ok"){
                    const li = document.createElement('li')
                    li.style.height = "0"
                    li.style.padding = "0px"
                    li.style.marginBottom = "2.5px"
                    li.innerHTML = `<span onclick = "edit(this,${result.task_id})">${description.value}</span> <span onclick='remove_task(${result.task_id},this)' class = "done-btn">DONE</span>`

                    tasks.appendChild(li)
                    setTimeout(()=>{
                        li.style.height = li.scrollHeight + "px"
                        li.style.padding = "10px"
                    },200)
                    description.value = ""
                }else if(result.status == "no login"){
                    alert("no login")
                }
            })
        })
    }

    
    const remove_task = (id,element)=>{
        let data = new FormData()
        data.append("id",id)
        data.append("csrf_token","{{csrf_token()}}")

        fetch("{{url_for('panel_blueprint.remove')}}",{
            method : "post",
            body:data
        }).then((res)=>{
            res.json().then((result)=>{
                if(result.status == "ok"){
                    element.parentElement.style.height = "0px"
                    element.parentElement.style.padding = "0px"

                    setTimeout(()=>{
                        element.parentElement.remove()
                    },300)


                    
                }else if(result.status == "no login"){
                    alert("no login")
                }
            })
        })
        
    }

    const edit = (element, id) => {
        if (element.innerText != "") {
            const input = document.createElement('input')
            input.classList.add("edit-input")
            input.type = 'text'
            input.addEventListener('focusout', function () {
                update_task(id, this)
            });
            input.value = element.innerText

            element.innerHTML = ''
            element.appendChild(input)

            input.focus()

        }
    }

    const update_task = (id, element) => {
        new_description = element.value
        let data = new FormData()
        data.append("id", id)
        data.append("description", new_description)
        data.append("csrf_token", "{{ csrf_token() }}")

        fetch("{{ url_for('panel_blueprint.update') }}", {
            method: "post",
            body: data
        }).then((res) => {
            res.json().then((result) => {
                if (result.status == "ok") {
                    element.parentElement.innerHTML = new_description
                } else if (result.status == "nologin") {
                    alert("no login")
                }
            })
        })
    }
</script>
{% endblock %}
